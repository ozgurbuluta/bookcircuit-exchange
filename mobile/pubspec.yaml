name: turtle_turning_pages
description: "Turtle Turning Pages - A community-driven book trading platform"
publish_to: 'none'

version: 1.0.0+10

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI/UX
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17

  # Forms & Validation
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1

  # Storage
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^9.2.4

  # Location & Maps
  geolocator: ^14.0.1
  google_maps_flutter: ^2.10.0

  # Camera & Images
  image_picker: ^1.1.2

  # Networking
  http: ^1.2.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  timeago: ^3.7.0
  share_plus: ^10.1.4
  firebase_ai: ^2.3.0
  geocoding: ^4.0.0
  path_provider: ^2.1.5
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^7.2.0
  app_links: ^6.4.1
  crypto: ^3.0.7
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  # Spec fonts (Young Serif + Schibsted Grotesk) are bundled locally so the
  # google_fonts package resolves them from assets — no network fetching.
